name: collect

# Duas execucoes por dia. Nao e para ter granularidade maior - e redundancia
# barata: o cron do GitHub Actions atrasa 10-30 min e as vezes PULA execucoes.
# Como a janela de metricas da Epic e de ~7 dias sem backfill, uma execucao
# perdida vira dado perdido para sempre.
on:
  schedule:
    - cron: "10 6 * * *"
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Recoletar historico de TODAS as ilhas conhecidas (lento)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      # Scraping do fortnite.gg: frágil (Cloudflare, mudanca de layout).
      # continue-on-error para que uma falha aqui NAO impeca a coleta de
      # metricas da Epic, que e a unica sem backfill.
      - name: ranks (fortnite.gg)
        id: ranks
        continue-on-error: true
        run: python -m collectors.ranks

      - name: dimensao de ilhas
        continue-on-error: true
        run: python -m collectors.islands

      - name: historico de colocacao
        continue-on-error: true
        run: |
          if [ "${{ inputs.full_history }}" = "true" ]; then
            python -m collectors.history --scope all
          else
            python -m collectors.history --scope today
          fi

      # Sem continue-on-error: se isto falhar, o dia esta perdido e queremos
      # que o workflow fique vermelho.
      - name: metricas (Epic API)
        run: python -m collectors.metrics

      - name: commit
        run: |
          git config user.name  "discover-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "sem mudancas"
          else
            git commit -m "dados: coleta de $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: abrir issue se o scraping quebrou
        if: steps.ranks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Coletor de ranks falhou';
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collector'
            });
            if (!data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['collector'],
                body: `O scrape do fortnite.gg falhou em ${context.runId}.\n\n`
                    + `O HTML bruto continua sendo salvo em \`data/raw_html/\`, `
                    + `entao da para reprocessar depois de corrigir o parser.`
              });
            }
