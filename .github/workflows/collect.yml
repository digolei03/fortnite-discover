name: collect

# Os coletores nao rodam todos na mesma cadencia, por dois motivos: manter o
# volume de requisicoes ao fortnite.gg baixo, e caber na cota do Actions
# (2.000 min/mes em repositorio privado; ilimitado em publico).
#
#   - `metrics` (Epic) e o UNICO genuinamente diario: a janela retroativa e de
#     ~7 dias e nao ha backfill. Dia nao coletado e dia perdido para sempre.
#     Roda 2x ao dia como redundancia, porque o cron do Actions atrasa 10-30 min
#     e as vezes PULA execucoes.
#   - `history` NAO precisa ser diario: os endpoints devolvem a serie COMPLETA
#     a cada chamada, entao a coleta de hoje ja contem a de ontem. Semanal para
#     todas as ilhas, diario apenas para as nossas.
#   - `ranks` e barato (~8s) e so existe no dia corrente, entao roda sempre.
#
# ~445 min/mes, contra ~1.440 se tudo rodasse 2x ao dia.
on:
  schedule:
    - cron: "10 6 * * *"     # diario
    - cron: "10 18 * * *"    # diario
    - cron: "40 4 * * 0"     # domingo: historico completo de todas as ilhas
  workflow_dispatch:
    inputs:
      full_history:
        description: "Recoletar historico de TODAS as ilhas conhecidas (~25 min)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # No nivel do JOB de proposito: um `env:` dentro do passo nao esta visivel
    # para o `if:` daquele mesmo passo, entao a condicao seria sempre falsa e o
    # coletor nunca rodaria.
    env:
      UEFN_DATA_API_URL: ${{ secrets.UEFN_DATA_API_URL }}
      UEFN_DATA_API_TOKEN: ${{ secrets.UEFN_DATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      # Historico completo so no cron de domingo ou quando pedido a mao.
      - name: decidir escopo do historico
        id: scope
        run: |
          if [ "${{ inputs.full_history }}" = "true" ] || \
             [ "${{ github.event.schedule }}" = "40 4 * * 0" ]; then
            echo "history=all" >> "$GITHUB_OUTPUT"
          else
            echo "history=ours" >> "$GITHUB_OUTPUT"
          fi

      # Scraping do fortnite.gg: fragil (Cloudflare, mudanca de layout).
      # continue-on-error para que uma falha aqui NAO impeca a coleta de
      # metricas da Epic, que e a unica sem backfill.
      #
      # ATENCAO: os IPs do GitHub Actions sao de datacenter e o Cloudflare pode
      # bloquea-los mesmo com curl_cffi. Se isto passar a falhar sempre, mova
      # ranks/islands/history para uma maquina do estudio e deixe so `metrics`
      # aqui - assim a parte insubstituivel continua protegida.
      - name: ranks (fortnite.gg)
        id: ranks
        continue-on-error: true
        run: python -m collectors.ranks

      - name: dimensao de ilhas
        continue-on-error: true
        run: python -m collectors.islands

      - name: historico de colocacao (${{ steps.scope.outputs.history }})
        continue-on-error: true
        run: python -m collectors.history --scope ${{ steps.scope.outputs.history }}

      # Colocacao pela API OFICIAL da Epic, via uefntoolkit. Só roda se os
      # secrets existirem - sem eles o repositorio segue funcionando com o
      # fortnite.gg como fonte de colocacao.
      - name: exposicao (API da Epic via uefntoolkit)
        if: env.UEFN_DATA_API_URL != '' && env.UEFN_DATA_API_TOKEN != ''
        continue-on-error: true
        run: python -m collectors.uefn_exposure

      # Sem continue-on-error: se isto falhar, o dia esta perdido e queremos
      # que o workflow fique vermelho.
      - name: metricas (Epic API)
        run: python -m collectors.metrics

      - name: commit
        run: |
          git config user.name  "discover-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "sem mudancas"
          else
            git commit -m "dados: coleta de $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: abrir issue se o scraping quebrou
        if: steps.ranks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Coletor de ranks falhou';
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collector'
            });
            if (!data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['collector'],
                body: `O scrape do fortnite.gg falhou em ${context.runId}.\n\n`
                    + `O HTML bruto continua sendo salvo em \`data/raw_html/\`, `
                    + `entao da para reprocessar depois de corrigir o parser.`
              });
            }
